<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title id="page-title">Runner Profile — RunRush</title>
  <meta name="description" content="Public running profile on RunRush — view stats, badges, and achievements.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0a0c10">
  <meta name="csrf-token" content="{{ csrf_token() }}">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">

  <style>
    :root {
      --accent:         #00f2ff;
      --accent-soft:    rgba(0, 242, 255, 0.10);
      --accent-lime:    #b0ff4f;
      --accent-orange:  #ff6e3a;
      --gold:           #FFD700;
      --bg-body:        #0a0c10;
      --bg-card:        rgba(12, 18, 30, 0.78);
      --bg-card-hover:  rgba(18, 28, 46, 0.88);
      --border-color:   rgba(0, 242, 255, 0.12);
      --border-subtle:  rgba(255,255,255,0.06);
      --text-primary:   #FFFFFF;
      --text-secondary: #c0c8d4;
      --text-tertiary:  #8892a0;
      --shadow-lg:      0 12px 32px rgba(0,0,0,0.6);
    }
    body.light-theme {
      --bg-body:        #F0F4F8;
      --bg-card:        rgba(255,255,255,0.93);
      --bg-card-hover:  #EBF0F5;
      --border-color:   rgba(0,0,0,0.10);
      --border-subtle:  rgba(0,0,0,0.05);
      --text-primary:   #0F172A;
      --text-secondary: #475569;
      --text-tertiary:  #64748B;
      --accent:         #007788;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: var(--bg-body);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body:not(.light-theme) {
      background:
        radial-gradient(circle at 0% 0%,   #0e1a24 0, transparent 50%),
        radial-gradient(circle at 100% 0%,  #0c1825 0, transparent 50%),
        radial-gradient(circle at 100% 100%,#0e1620 0, transparent 50%),
        radial-gradient(circle at 0% 100%,  #0a1520 0, transparent 50%),
        var(--bg-body);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d1018; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    .glass {
      background: var(--bg-card);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    body.light-theme .glass { backdrop-filter: none; -webkit-backdrop-filter: none; }
    .btn-back {
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-card-hover);
      color: var(--text-primary);
      padding: 0.4rem 1.1rem;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .rr-toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 0.8rem 1.2rem;
      font-size: 0.85rem; color: var(--text-primary);
      z-index: 9999; backdrop-filter: blur(16px); box-shadow: var(--shadow-lg);
      transform: translateY(20px); opacity: 0;
      transition: all 0.3s ease; pointer-events: none;
    }
    .rr-toast.show { transform: translateY(0); opacity: 1; }
    .rr-toast.success { border-color: rgba(176,255,79,0.4); }
    .rr-toast.error   { border-color: rgba(255,110,58,0.4); }
  </style>
</head>
<body>
  <div class="rr-toast" id="toast" role="status" aria-live="polite"></div>
  <div class="container py-4" style="max-width: 860px;">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <a href="/dashboard" class="btn-back" id="back-btn">
        <i class="fa fa-arrow-left" style="font-size:0.8rem;"></i> Back
      </a>
      <span class="text-muted" style="font-size:0.8rem;">Runner Profile</span>
    </div>

    {% include 'components/profile_content.html' %}

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/profile.js') }}"></script>
  <script>
    (function() {
      var t = localStorage.getItem('theme') || '{{ theme }}' || 'dark';
      if (t === 'light') document.body.classList.add('light-theme');
    })();

    var PROFILE_USERNAME = {{ profile_username | tojson }};
    var IS_OWN_PROFILE   = {{ is_own_profile | tojson }};
    var VIEWER_USERNAME  = {{ viewer_username | tojson }};

    var referrer = document.referrer;
    if (referrer && referrer.indexOf('/u/') === -1) {
      var href = referrer.indexOf('leaderboard') !== -1 ? '/leaderboard'
               : referrer.indexOf('social') !== -1 ? '/social-feed' : '/dashboard';
      document.getElementById('back-btn').href = href;
    }

    loadProfile(PROFILE_USERNAME, IS_OWN_PROFILE);
    loadHeatmap(PROFILE_USERNAME);
    initProfileEvents(PROFILE_USERNAME);
  </script>
</body>
</html>

{% from "_icons.html" import icon %}
<!-- Coming Soon Modal Dialog Component -->
<div id="comingSoonModal" class="coming-soon-backdrop" role="dialog" aria-modal="true" aria-labelledby="comingSoonTitle" hidden onclick="handleComingSoonBackdrop(event)">
  <div class="coming-soon-card" onclick="event.stopPropagation()">
    <button type="button" class="coming-soon-close" onclick="closeComingSoonModal()" aria-label="Close dialog">
      &times;
    </button>
    <div class="coming-soon-icon-wrap" aria-hidden="true">
      {{ icon('hourglass', class='rotating-hourglass', width=26, height=26) }}
    </div>
    <h3 id="comingSoonTitle" class="coming-soon-title">Coming Soon</h3>
    <p class="coming-soon-desc">Apple Sign-In is in development and will be available in a future update.</p>
    <button type="button" class="coming-soon-dismiss-btn" id="comingSoonOkBtn" onclick="closeComingSoonModal()">
      Got it
    </button>
  </div>
</div>

<style>
  .coming-soon-backdrop {
    position: fixed !important;
    inset: 0 !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    z-index: 99999 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 16px !important;
    background: rgba(4, 6, 9, 0.78) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    margin: 0 !important;
    box-sizing: border-box !important;
  }

  .coming-soon-backdrop.is-visible {
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: auto !important;
  }

  .coming-soon-card {
    position: relative !important;
    width: 100% !important;
    max-width: 310px !important;
    background: #0F1218 !important;
    border: 1px solid rgba(255, 255, 255, 0.14) !important;
    border-radius: 20px !important;
    padding: 28px 22px 22px !important;
    text-align: center !important;
    box-shadow: 0 24px 48px -8px rgba(0, 0, 0, 0.8), 0 0 24px rgba(74, 222, 128, 0.12) !important;
    transform: scale(0.92) translateY(10px) !important;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    box-sizing: border-box !important;
    margin: 0 auto !important;
  }

  .coming-soon-backdrop.is-visible .coming-soon-card {
    transform: scale(1) translateY(0) !important;
  }

  .coming-soon-close {
    position: absolute !important;
    top: 12px !important;
    right: 12px !important;
    width: 32px !important;
    height: 32px !important;
    padding: 0 !important;
    margin: 0 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: rgba(255, 255, 255, 0.06) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: #9BA3AF !important;
    font-size: 20px !important;
    line-height: 1 !important;
    cursor: pointer !important;
    border-radius: 9999px !important;
    transition: background 0.15s, color 0.15s, transform 0.15s !important;
  }

  .coming-soon-close:hover {
    background: rgba(255, 255, 255, 0.14) !important;
    color: #F3F4F6 !important;
    transform: scale(1.05) !important;
  }

  .coming-soon-icon-wrap {
    width: 58px !important;
    height: 58px !important;
    margin: 0 auto 16px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border-radius: 9999px !important;
    background: rgba(74, 222, 128, 0.12) !important;
    color: #4ADE80 !important;
    border: 1px solid rgba(74, 222, 128, 0.28) !important;
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.18) !important;
  }

  .rotating-hourglass {
    display: block !important;
    animation: hourglass-flip 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite !important;
    transform-origin: center center !important;
  }

  @keyframes hourglass-flip {
    0% {
      transform: rotate(0deg);
    }
    15% {
      transform: rotate(0deg);
    }
    45% {
      transform: rotate(180deg);
    }
    65% {
      transform: rotate(180deg);
    }
    95% {
      transform: rotate(360deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }

  .coming-soon-title {
    font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    font-size: 19px !important;
    font-weight: 700 !important;
    color: #F3F4F6 !important;
    margin: 0 0 8px !important;
    letter-spacing: -0.01em !important;
  }

  .coming-soon-desc {
    font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    font-size: 13.5px !important;
    color: #9BA3AF !important;
    line-height: 1.5 !important;
    margin: 0 0 20px !important;
  }

  .coming-soon-dismiss-btn {
    width: 100% !important;
    min-height: 44px !important;
    padding: 11px 16px !important;
    border-radius: 12px !important;
    background: #22C55E !important;
    color: #07090C !important;
    font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    font-weight: 700 !important;
    font-size: 14px !important;
    border: none !important;
    cursor: pointer !important;
    box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3) !important;
    transition: background 0.15s, transform 0.15s !important;
  }

  .coming-soon-dismiss-btn:hover {
    background: #4ADE80 !important;
    transform: translateY(-1px) !important;
  }
</style>

<script>
  let comingSoonTimer = null;

  function showComingSoonModal() {
    const modal = document.getElementById('comingSoonModal');
    const okBtn = document.getElementById('comingSoonOkBtn');
    if (!modal) return;

    modal.hidden = false;
    void modal.offsetWidth; // Trigger reflow for animation
    modal.classList.add('is-visible');

    if (okBtn) {
      setTimeout(() => okBtn.focus(), 50);
    }

    if (comingSoonTimer) clearTimeout(comingSoonTimer);
    comingSoonTimer = setTimeout(() => {
      closeComingSoonModal();
    }, 4500);
  }

  function closeComingSoonModal() {
    const modal = document.getElementById('comingSoonModal');
    if (!modal) return;
    if (comingSoonTimer) clearTimeout(comingSoonTimer);

    modal.classList.remove('is-visible');
    setTimeout(() => {
      modal.hidden = true;
    }, 250);

    const appleBtn = document.getElementById('appleLoginBtn') || document.getElementById('appleRegisterBtn');
    if (appleBtn) appleBtn.focus();
  }

  function handleComingSoonBackdrop(e) {
    if (e.target && e.target.id === 'comingSoonModal') {
      closeComingSoonModal();
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      const modal = document.getElementById('comingSoonModal');
      if (modal && !modal.hidden) {
        closeComingSoonModal();
      }
    }
  });
</script>

<!-- Rainbow Expandable Quick Action FAB -->
<div id="quickActionsBackdrop" class="quick-actions-backdrop" onclick="toggleQuickActions(false)"></div>

<div id="quickActionsFab" class="quick-actions-wrapper" aria-label="Quick Actions">
  <!-- Glowing rainbow ambient aura -->
  <div class="rainbow-arc-glow"></div>

  <!-- Child Action 1: Live GPS Run (Green / Emerald) -->
  <div class="quick-action-item item-live-run" style="--tx: 0px; --ty: -98px; --delay: 0.03s;">
    <span class="quick-action-label">Live GPS Run</span>
    <button id="startRunBtn" type="button" class="quick-action-btn btn-live-run" onclick="handleQuickAction('live')" aria-label="Start Live GPS Run" title="Start Live GPS Run">
      <i class="fa-solid fa-play"></i>
    </button>
  </div>

  <!-- Child Action 2: Voice Quick Log (Violet / Purple) -->
  <div class="quick-action-item item-voice-log" style="--tx: -70px; --ty: -70px; --delay: 0.07s;">
    <span class="quick-action-label">Voice Quick Log</span>
    <button id="voiceQuickLogBtn" type="button" class="quick-action-btn btn-voice-log" onclick="handleQuickAction('voice')" aria-label="Voice Quick Log" title="Voice Quick Log">
      <i class="fa-solid fa-microphone"></i>
    </button>
  </div>

  <!-- Child Action 3: Manual Log Run (Amber / Coral) -->
  <div class="quick-action-item item-manual-log" style="--tx: -98px; --ty: 0px; --delay: 0.11s;">
    <span class="quick-action-label">Manual Log</span>
    <button id="manualLogBtn" type="button" class="quick-action-btn btn-manual-log" onclick="handleQuickAction('manual')" aria-label="Manual Log Run" title="Manual Log Run">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!-- Main Trigger Button (Rainbow gradient ring + RunRush Shoe Logo in circle) -->
  <button id="quickActionsTrigger" type="button" class="quick-actions-trigger" onclick="toggleQuickActions()" aria-label="Quick Actions" title="Quick Actions (RunRush)" aria-expanded="false">
    <span class="trigger-rainbow-ring"></span>
    <span class="trigger-inner-circle">
      <img src="{{ url_for('static', filename='img/shoe-logo-transparent.png') }}" onerror="this.src='/static/favicon.png'" class="trigger-shoe-logo" alt="RunRush">
      <i class="fa-solid fa-xmark trigger-close-icon" id="quickActionsCloseIcon" aria-hidden="true"></i>
    </span>
  </button>
</div>

<style>
  /* ─── Backdrop Scrim ─────────────────────────────────────── */
  .quick-actions-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1045;
    background: rgba(10, 10, 14, 0.65);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
  }
  .quick-actions-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* ─── Container ──────────────────────────────────────────── */
  .quick-actions-wrapper {
    position: fixed;
    bottom: 85px;
    right: 20px;
    z-index: 1055;
    width: 60px;
    height: 60px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ─── Rainbow Arc Ambient Glow ───────────────────────────── */
  .rainbow-arc-glow {
    position: absolute;
    bottom: -15px;
    right: -15px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.6);
    filter: blur(20px);
    background: conic-gradient(
      from 180deg at 100% 100%,
      rgba(245, 158, 11, 0.8),
      rgba(239, 68, 68, 0.85),
      rgba(168, 85, 247, 0.85),
      rgba(59, 130, 246, 0.85),
      rgba(16, 185, 129, 0.85)
    );
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .quick-actions-wrapper.open .rainbow-arc-glow {
    opacity: 0.35;
    transform: scale(1);
  }

  /* ─── Main Trigger FAB ───────────────────────────────────── */
  .quick-actions-trigger {
    position: relative;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    outline: none;
    cursor: pointer;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 2;
  }
  .quick-actions-trigger:hover {
    transform: scale(1.08);
  }
  .quick-actions-trigger:active {
    transform: scale(0.94);
  }
  .quick-actions-wrapper.open .quick-actions-trigger {
    transform: scale(1.02);
  }

  /* Animated rainbow border ring */
  .trigger-rainbow-ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6, #06b6d4, #10b981);
    background-size: 250% 250%;
    animation: rainbowShift 6s ease infinite;
    filter: blur(2px);
    box-shadow: 0 8px 24px rgba(236, 72, 153, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
    z-index: 0;
    transition: box-shadow 0.3s ease;
  }
  .quick-actions-wrapper.open .trigger-rainbow-ring {
    box-shadow: 0 10px 30px rgba(139, 92, 246, 0.65);
  }

  /* Inner dark circle badge containing the shoe logo */
  .trigger-inner-circle {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #222232, #12121c 85%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 1;
    border: 2px solid rgba(255, 255, 255, 0.18);
    box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.12), inset 0 -2px 6px rgba(0, 0, 0, 0.5);
  }

  /* RunRush Shoe logo */
  .trigger-shoe-logo {
    width: 38px;
    height: 38px;
    object-fit: contain;
    transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
  }
  .quick-actions-wrapper.open .trigger-shoe-logo {
    opacity: 0;
    transform: scale(0.3) rotate(90deg);
  }

  /* Close X icon */
  .trigger-close-icon {
    position: absolute;
    font-size: 1.45rem;
    color: #ffffff;
    opacity: 0;
    transform: scale(0.3) rotate(-90deg);
    transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .quick-actions-wrapper.open .trigger-close-icon {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  /* ─── Child Action Items ─────────────────────────────────── */
  .quick-action-item {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transform: translate(0, 0) scale(0.3);
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s ease;
    transition-delay: var(--delay, 0s);
    z-index: 1;
  }
  .quick-actions-wrapper.open .quick-action-item {
    pointer-events: auto;
    opacity: 1;
    transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1);
  }

  .quick-action-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.25);
    outline: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    color: #ffffff;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
    padding: 0;
  }
  .quick-action-btn:hover {
    transform: scale(1.12);
  }
  .quick-action-btn:active {
    transform: scale(0.92);
  }

  /* Individual Rainbow Themes */
  .btn-live-run {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    box-shadow: 0 6px 18px rgba(16, 185, 129, 0.5);
  }
  .btn-live-run:hover {
    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.7);
  }

  .btn-voice-log {
    background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
    box-shadow: 0 6px 18px rgba(139, 92, 246, 0.5);
  }
  .btn-voice-log:hover {
    box-shadow: 0 8px 24px rgba(139, 92, 246, 0.7);
  }

  .btn-manual-log {
    background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
    box-shadow: 0 6px 18px rgba(245, 158, 11, 0.5);
  }
  .btn-manual-log:hover {
    box-shadow: 0 8px 24px rgba(245, 158, 11, 0.7);
  }

  /* ─── Action Labels (Pills) ──────────────────────────────── */
  .quick-action-label {
    position: absolute;
    right: calc(100% + 10px);
    background: rgba(18, 18, 24, 0.94);
    color: #ffffff;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 5px 10px;
    border-radius: 10px;
    white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    opacity: 0;
    pointer-events: none;
    transform: translateX(8px);
    transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .quick-actions-wrapper.open .quick-action-label {
    opacity: 1;
    transform: translateX(0);
    transition-delay: calc(var(--delay, 0s) + 0.06s);
  }

  /* Positioning for manual log label */
  .item-manual-log .quick-action-label {
    right: auto;
    bottom: calc(100% + 10px);
    transform: translateY(8px);
  }
  .quick-actions-wrapper.open .item-manual-log .quick-action-label {
    transform: translateY(0);
  }

  @keyframes rainbowShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</style>

<script>
  function toggleQuickActions(forceState) {
    const wrapper = document.getElementById('quickActionsFab');
    const backdrop = document.getElementById('quickActionsBackdrop');
    const trigger = document.getElementById('quickActionsTrigger');
    if (!wrapper) return;

    const isOpen = typeof forceState === 'boolean' 
      ? forceState 
      : !wrapper.classList.contains('open');

    if (isOpen) {
      wrapper.classList.add('open');
      if (backdrop) backdrop.classList.add('open');
      if (trigger) trigger.setAttribute('aria-expanded', 'true');
    } else {
      wrapper.classList.remove('open');
      if (backdrop) backdrop.classList.remove('open');
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
    }
  }

  function closeQuickActions() {
    toggleQuickActions(false);
  }

  function handleQuickAction(actionType) {
    closeQuickActions();

    if (actionType === 'live') {
      if (typeof openLiveRunTracker === 'function') {
        openLiveRunTracker();
      }
    } else if (actionType === 'voice') {
      if (typeof openVoiceQuickLog === 'function') {
        openVoiceQuickLog();
      }
    } else if (actionType === 'manual') {
      const modalEl = document.getElementById('addRunModal');
      if (modalEl && typeof bootstrap !== 'undefined') {
        const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        modal.show();
      }
    }
  }

  // Close when pressing Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeQuickActions();
    }
  });
</script>

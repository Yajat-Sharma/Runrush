<!-- Live Run Tracker — full-screen overlay with Trail Map -->
<style nonce="{{ csp_nonce() }}">
  /* Live runner pulse marker */
  .lrt-pulse-container {
    position: relative;
    width: 22px;
    height: 22px;
  }
  .lrt-pulse-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: rgba(16, 185, 129, 0.45);
    animation: lrtPulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
  }
  .lrt-pulse-dot {
    position: absolute;
    inset: 3px;
    background: #10b981;
    border: 3px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
  }
  @keyframes lrtPulseRing {
    0% { transform: scale(0.6); opacity: 0.95; }
    70% { transform: scale(1.7); opacity: 0; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  /* Trail Start & Finish badges */
  .lrt-map-badge {
    padding: 4px 9px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.05em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 2px solid #ffffff;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
    white-space: nowrap;
    text-transform: uppercase;
  }
  .lrt-badge-start {
    background: #10b981;
    color: #ffffff;
  }
  .lrt-badge-finish {
    background: #ef4444;
    color: #ffffff;
  }
  .lrt-split-badge {
    width: 24px;
    height: 24px;
    background: #111827;
    color: #10b981;
    border: 2px solid #10b981;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
  }

  /* Post-Run Review bottom drawer */
  #lrtReviewOverlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(18, 18, 22, 0.96);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.7);
    z-index: 1000;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 80vh;
    overflow-y: auto;
    padding: 12px 20px 24px;
  }
  #lrtReviewOverlay.lrt-collapsed {
    transform: translateY(calc(100% - 64px));
  }
</style>

<div id="liveRunOverlay" style="display:none;position:fixed;inset:0;z-index:2000;background:#111;flex-direction:column;overflow:hidden;">

  <!-- Top bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1a1a1e;flex-shrink:0;z-index:100;border-bottom:1px solid #2a2a2e;">
    <button class="btn btn-link text-danger p-0" data-action="closeLiveRunTracker" aria-label="Close" title="Exit Tracker">
      <i class="fa-solid fa-xmark fa-lg"></i>
    </button>
    <div style="display:flex;align-items:center;gap:6px;">
      <span id="lrtHeaderTitle" style="font-size:1rem;font-weight:700;color:#fff;letter-spacing:.05em;">🏃 LIVE RUN</span>
      <span id="lrtWakeLockBadge" style="display:none;font-size:0.75rem;color:#ffc107;background:rgba(255,193,7,0.15);padding:3px 8px;border-radius:12px;" title="Screen wake lock active — phone screen will stay on"><i class="fa-solid fa-sun me-1"></i>Screen On</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button id="lrtSimulateBtn" class="btn btn-sm btn-outline-info py-0 px-2" style="font-size:0.72rem;font-weight:600;" data-action="simulateLiveRunDemo" title="Simulate a live run trail for testing">
        <i class="fa-solid fa-wand-magic-sparkles me-1"></i>Demo
      </button>
    </div>
  </div>

  <!-- Live timer section (large) — hidden when reviewing finished run -->
  <div id="lrtTimerSection" style="text-align:center;padding:14px 16px 8px;background:#151518;flex-shrink:0;border-bottom:1px solid #222;">
    <div id="lrtElapsed" style="font-size:3.2rem;font-weight:800;color:#10b981;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1;">00:00</div>
    <div id="lrtWaitingGps" style="color:#aaa;font-size:.85rem;margin-top:4px;">📡 Waiting for GPS fix…</div>
  </div>

  <!-- Map area with floating controls -->
  <div id="liveRunMapContainer" style="flex:1;min-height:0;width:100%;position:relative;background:#0d1117;">
    <!-- Leaflet map -->
    <div id="liveRunMap" style="height:100%;width:100%;"></div>

    <!-- Floating Re-center button -->
    <button id="lrtRecenterBtn" class="btn btn-dark shadow" style="display:none;position:absolute;top:14px;right:14px;z-index:400;border-radius:50%;width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(24,24,28,0.9);border:1px solid #444;color:#fff;" title="Center on my location" data-action="recenterLiveRunMap">
      <i class="fa-solid fa-location-crosshairs"></i>
    </button>

    <!-- Floating Fit Trail button -->
    <button id="lrtFitTrailBtn" class="btn btn-dark shadow" style="display:none;position:absolute;top:14px;right:14px;z-index:400;border-radius:20px;padding:6px 14px;background:rgba(24,24,28,0.9);border:1px solid #444;color:#10b981;font-size:0.8rem;font-weight:700;align-items:center;gap:6px;" title="Zoom to fit full trail" data-action="fitLiveRunTrail">
      <i class="fa-solid fa-route"></i> Fit Trail
    </button>

    <!-- Trail summary floating pill (shown during finish review) -->
    <div id="lrtTrailSummaryBadge" style="display:none;position:absolute;top:14px;left:14px;z-index:400;background:rgba(18,18,22,0.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:5px 12px;color:#fff;font-size:0.8rem;font-weight:600;display:flex;align-items:center;gap:8px;">
      <span style="color:#10b981;">●</span> <span id="lrtTrailPillDist">0.00 km</span>
    </div>
  </div>

  <!-- Live Stats row — hidden when reviewing finished run -->
  <div id="lrtLiveStatsRow" style="display:flex;justify-content:space-around;padding:12px 16px;background:#1a1a1e;flex-shrink:0;border-top:1px solid #2a2a2e;">
    <div style="text-align:center;">
      <div id="lrtDistance" style="font-size:1.6rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;">0.00</div>
      <div style="font-size:.7rem;color:#aaa;text-transform:uppercase;letter-spacing:.08em;">km</div>
    </div>
    <div style="text-align:center;">
      <div id="lrtPace" style="font-size:1.6rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;">--:--</div>
      <div style="font-size:.7rem;color:#aaa;text-transform:uppercase;letter-spacing:.08em;">pace /km</div>
    </div>
  </div>

  <!-- Live Controls row — hidden when reviewing finished run -->
  <div id="lrtControlsRow" style="display:flex;gap:12px;padding:14px 16px;background:#111;flex-shrink:0;justify-content:center;border-top:1px solid #222;">
    <button id="lrtStartBtn" class="btn btn-success btn-lg px-5 fw-bold" data-action="startLiveRun">
      <i class="fa-solid fa-play me-2"></i>Start
    </button>
    <button id="lrtPauseBtn" class="btn btn-warning btn-lg px-4 fw-bold" style="display:none;" data-action="toggleLiveRunPause">
      <i class="fa-solid fa-pause"></i> Pause
    </button>
    <button id="lrtFinishBtn" class="btn btn-danger btn-lg px-4 fw-bold" style="display:none;" data-action="finishLiveRun">
      <i class="fa-solid fa-flag-checkered me-1"></i>Finish
    </button>
  </div>

  <!-- Review drawer (slides up over bottom when user is done running, keeping trail visible!) -->
  <div id="lrtReviewOverlay" style="display:none;">
    <!-- Drag handle / toggle button to view full map trail -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:1.4rem;">🏅</span>
        <div>
          <h5 style="color:#fff;font-weight:800;margin:0;font-size:1.1rem;">Run Complete!</h5>
          <span style="color:#9ca3af;font-size:0.75rem;">Your route trail is mapped above</span>
        </div>
      </div>
      <button id="lrtToggleMapBtn" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1" style="font-size:0.75rem;color:#e5e7eb;border-color:#4b5563;" data-action="toggleReviewDrawer">
        <i id="lrtToggleMapIcon" class="fa-solid fa-map me-1"></i><span id="lrtToggleMapText">Full Map</span>
      </button>
    </div>

    <!-- Stats Grid -->
    <div id="lrtReviewStatsGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:16px;">
      <div style="background:#222228;border-radius:12px;padding:12px 14px;text-align:center;border:1px solid #33333d;">
        <div id="lrtRevDist" style="font-size:1.7rem;font-weight:800;color:#10b981;line-height:1.1;">--</div>
        <div style="font-size:.72rem;color:#9ca3af;margin-top:4px;text-transform:uppercase;letter-spacing:0.05em;">Distance</div>
      </div>
      <div style="background:#222228;border-radius:12px;padding:12px 14px;text-align:center;border:1px solid #33333d;">
        <div id="lrtRevTime" style="font-size:1.7rem;font-weight:800;color:#fff;line-height:1.1;">--</div>
        <div style="font-size:.72rem;color:#9ca3af;margin-top:4px;text-transform:uppercase;letter-spacing:0.05em;">Duration</div>
      </div>
      <div style="background:#222228;border-radius:12px;padding:12px 14px;text-align:center;border:1px solid #33333d;">
        <div id="lrtRevPace" style="font-size:1.7rem;font-weight:800;color:#38bdf8;line-height:1.1;">--</div>
        <div style="font-size:.72rem;color:#9ca3af;margin-top:4px;text-transform:uppercase;letter-spacing:0.05em;">Avg Pace</div>
      </div>
      <div style="background:#222228;border-radius:12px;padding:12px 14px;text-align:center;border:1px solid #33333d;">
        <div id="lrtRevCal" style="font-size:1.7rem;font-weight:800;color:#fbbf24;line-height:1.1;">--</div>
        <div style="font-size:.72rem;color:#9ca3af;margin-top:4px;text-transform:uppercase;letter-spacing:0.05em;">Calories</div>
      </div>
    </div>

    <!-- Review Action Buttons -->
    <div id="lrtReviewActions" style="display:flex;flex-direction:column;gap:10px;width:100%;">
      <button id="lrtSaveBtn" class="btn btn-success btn-lg fw-bold w-100 shadow" data-action="saveLiveRun">
        <i class="fa-solid fa-floppy-disk me-2"></i>Save Run to Log
      </button>
      <div style="display:flex;gap:10px;width:100%;">
        <button id="lrtResumeBtn" class="btn btn-outline-warning fw-semibold flex-fill" data-action="resumeLiveRunFromReview">
          <i class="fa-solid fa-play me-1"></i>Resume Run
        </button>
        <button class="btn btn-outline-danger fw-semibold flex-fill" data-action="discardLiveRun">
          <i class="fa-solid fa-trash me-1"></i>Discard
        </button>
      </div>
    </div>
  </div>

</div>

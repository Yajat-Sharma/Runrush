<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RunRush – Set Your PIN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0e1a24; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: rgba(10, 16, 28, 0.6); padding: 2.5rem 2rem; border-radius: 24px; border: 1px solid rgba(0, 242, 255, 0.12); width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .btn-glow { width: 100%; padding: 0.85rem; border: 2px solid #00f2ff; border-radius: 14px; background: rgba(0, 242, 255, 0.06); color: #00f2ff; cursor: pointer; font-size: 1.05rem; font-weight: 700; transition: transform 0.2s, box-shadow 0.2s; }
    .btn-glow:hover { transform: translateY(-3px); box-shadow: 0 0 30px rgba(0, 242, 255, 0.3); background: rgba(0, 242, 255, 0.12); }
    input { width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; margin-bottom: 1.5rem; font-size: 1rem; letter-spacing: 0.1em; outline: none; }
    input:focus { border-color: #00f2ff; box-shadow: 0 0 0 3px rgba(0,242,255,0.12); background: rgba(255,255,255,0.06); }
    .error { background: rgba(255, 80, 80, 0.1); color: #ff6b6b; padding: 0.8rem; border-radius: 10px; margin-bottom: 1.5rem; font-size: 0.9rem; border: 1px solid rgba(255, 80, 80, 0.3); }
    .brand-icon { width: 50px; height: 50px; border-radius: 14px; border: 2px solid #00f2ff; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem; box-shadow: 0 0 18px rgba(0, 242, 255, 0.2); }
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon">⚡</div>
      <h2 style="margin:0 0 0.5rem 0;">Secure your Account</h2>
      <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem; margin:0; line-height:1.5;">Welcome, <strong style="color:#fff;">{{ username }}</strong>! Please set a 4+ digit numeric PIN. This serves as your backup login method.</p>
    </div>
    {% if error %}
      <div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label style="display:block; margin-bottom: 0.5rem; font-size: 0.8rem; color: rgba(255,255,255,0.6); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">New PIN</label>
      <input type="password" name="pin" required minlength="4" inputmode="numeric" pattern="[0-9]*" autofocus placeholder="••••">
      <button type="submit" class="btn-glow"><i class="fas fa-lock" style="margin-right: 0.5rem;"></i> Complete Setup</button>
    </form>
  </div>
</body>
</html>
